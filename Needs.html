    :root {
      color-scheme: light;
      --bg: #faf9f6;
      --panel: #f3efe7;
      --text: #2b2a27;
      --muted: #6b6257;
      --accent: #654735;
      --accent-soft: #efe5db;
      --link: #7a5430;
      --line: #e2d8c8;
      --hover: #f0ede6;
      --read-size: 1.2rem;
      --serif: "Mukta Malar", Georgia, "Noto Serif Tamil", "Nirmala UI", "Latha", "Tamil Sangam MN", serif;
      --sans: "Mukta Malar", system-ui, -apple-system, "Segoe UI", "Noto Sans Tamil", "Nirmala UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #1a1816; --panel: #231f1c; --text: #ece6da; --muted: #b5ab9b;
        --accent: #e0bf9f; --accent-soft: #3b2e26; --link: #e0bf9f; --line: #3a342d; --hover: #2a2622;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1a1816; --panel: #231f1c; --text: #ece6da; --muted: #b5ab9b;
      --accent: #e0bf9f; --accent-soft: #3b2e26; --link: #e0bf9f; --line: #3a342d; --hover: #2a2622;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--sans);
      line-height: 1.8;
      color: var(--text);
      background: var(--bg);
    }
    a { color: var(--link); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    /* top bar */
    .topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: .5rem;
      padding: .55rem 1rem;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-title { font-size: .88rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .spacer { flex: 1; }
    .icon-btn {
      flex: none; min-width: 2.4rem; height: 2.4rem;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--line); border-radius: 9px; padding: 0 .6rem;
      background: var(--panel); color: var(--text);
      font: inherit; font-size: .9rem; text-decoration: none; cursor: pointer;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 1.15rem; height: 1.15rem; display: block; }

    /* page */
    main { max-width: 720px; margin: 0 auto; padding: clamp(28px, 7vw, 64px) 22px 72px; }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.7rem, 6vw, 2.6rem);
      line-height: 1.5;
      color: var(--accent);
      text-wrap: balance;
    }
    h2 {
      margin: clamp(40px, 8vw, 64px) 0 0;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.35rem, 4.5vw, 1.75rem);
      line-height: 1.5;
      color: var(--accent);
    }

    .verse {
      margin: 18px 0 24px;
      font-family: var(--serif);
      font-size: var(--read-size);
      line-height: 2.05;
      overflow-wrap: anywhere;
    }

    /* callouts */
    .callout {
      margin: 24px 0 0;
      padding: 14px 18px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
    }
    .callout-title {
      margin: 0 0 4px;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1rem;
      color: var(--accent);
    }
    .callout p:not(.callout-title) { margin: 0; color: var(--text); }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .backlink{margin:0 0 22px;font-size:.92rem}.backlink a{color:var(--link);text-decoration:none}.backlink a:hover{text-decoration:underline}
</style>
</head>

</header><main><p class="backlink"><a href="MyRealisation.html">← My Realisation</a></p><h1>Needs</h1><section><p class="verse">A proper தமிழ் dictionary</p></section></main>
<script>(function(){const r=document.documentElement;function s(){return parseFloat(r.style.getPropertyValue('--read-size'))||1.12}
document.getElementById('size-up').addEventListener('click',()=>{let v=Math.min(1.8,s()+.1);r.style.setProperty('--read-size',v+'rem');try{localStorage.setItem('tv-size',v)}catch(e){}});
document.getElementById('size-down').addEventListener('click',()=>{let v=Math.max(.85,s()-.1);r.style.setProperty('--read-size',v+'rem');try{localStorage.setItem('tv-size',v)}catch(e){}});
document.getElementById('theme-toggle').addEventListener('click',()=>{let t=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=t;try{localStorage.setItem('tv-theme',t)}catch(e){}})})();</script></body></html>
